[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxr-profiler"
dynamic = ["version"]
description = "Read-only thermal/performance profiler for Galaxy XR (SM-I610) over wireless ADB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
packaging = ["pyinstaller>=6"]

[project.scripts]
gxr-profiler = "gxr_profiler.cli.app:main"

[tool.setuptools.packages.find]
include = ["gxr_profiler*"]

[tool.setuptools.package-data]
"gxr_profiler.server" = ["web/*", "web/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "gxr_profiler.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Defensive read-only tooling: broad excepts and NaN self-compare are intentional.
ignore = ["BLE001", "S110", "PLR0124", "B008", "PLW1510", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
