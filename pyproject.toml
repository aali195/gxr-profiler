[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxr-profiler"
dynamic = ["version"]
description = "Thermal/performance profiler for Galaxy XR (SM-I610) over wireless ADB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
packaging = ["pyinstaller>=6"]

[project.scripts]
gxr-profiler = "gxr_profiler.cli.app:main"
gxr-manager = "gxr_manager.cli.app:main"

[tool.setuptools.packages.find]
include = ["gxr_profiler*", "gxr_core*", "gxr_manager*"]

[tool.setuptools.package-data]
"gxr_core" = ["web_common/*"]
"gxr_profiler.server" = ["web/*", "web/vendor/*"]
"gxr_manager.server" = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "gxr_profiler.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# Defensive read-only tooling: broad excepts and NaN self-compare are intentional.
ignore = ["B008", "BLE001", "S110", "PLR0124", "PLW1510", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
