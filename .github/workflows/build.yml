name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[packaging]"

      - name: Build GUI and CLI one-file executables
        run: python -m PyInstaller packaging/gxr-profiler.spec --noconfirm

      - name: Verify both executables
        shell: pwsh
        run: |
          $paths = @("dist/gxr-profiler.exe", "dist/gxr-profiler-cli.exe")
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing build output: $path"
            }
          }
          & "dist/gxr-profiler-cli.exe" --help | Out-Null

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -LiteralPath "dist/gxr-profiler.exe", "dist/gxr-profiler-cli.exe" |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: gxr-profiler-windows
          path: |
            dist/gxr-profiler.exe
            dist/gxr-profiler-cli.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GXR Profiler ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/gxr-profiler.exe
            dist/gxr-profiler-cli.exe
            dist/SHA256SUMS.txt
