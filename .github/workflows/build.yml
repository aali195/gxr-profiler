name: GXR Tools build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - name: Check browser JavaScript syntax
        run: |
          node --check gxr_tools/core/web_common/common.js
          node --check gxr_tools/profiler/server/web/app.core.js
          node --check gxr_tools/profiler/server/web/app.compare.js
          node --check gxr_tools/profiler/server/web/app.record.js
          node --check gxr_tools/profiler/server/web/app.find.js
          node --check gxr_tools/profiler/server/web/app.js
          node --check gxr_tools/manager/server/web/app.core.js
          node --check gxr_tools/manager/server/web/diagnostics.js
          node --check gxr_tools/manager/server/web/apps.js
          node --check gxr_tools/manager/server/web/installer.js
          node --check gxr_tools/manager/server/web/settings.js
          node --check gxr_tools/manager/server/web/app.js
      - run: python -m pytest -q

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[packaging]"

      - name: Build profiler and manager executables
        run: |
          python -m PyInstaller packaging/gxr-profiler.spec --noconfirm
          python -m PyInstaller packaging/gxr-manager.spec --noconfirm

      - name: Verify all executables
        shell: pwsh
        run: |
          $paths = @(
            "dist/gxr-profiler.exe",
            "dist/gxr-profiler-cli.exe",
            "dist/gxr-manager.exe",
            "dist/gxr-manager-cli.exe"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing build output: $path"
            }
          }
          & "dist/gxr-profiler-cli.exe" --help | Out-Null
          & "dist/gxr-manager-cli.exe" --help | Out-Null

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -LiteralPath "dist/gxr-profiler.exe", "dist/gxr-profiler-cli.exe", "dist/gxr-manager.exe", "dist/gxr-manager-cli.exe" |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: gxr-tools-windows
          path: |
            dist/gxr-profiler.exe
            dist/gxr-profiler-cli.exe
            dist/gxr-manager.exe
            dist/gxr-manager-cli.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GXR Tools ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/gxr-profiler.exe
            dist/gxr-profiler-cli.exe
            dist/gxr-manager.exe
            dist/gxr-manager-cli.exe
            dist/SHA256SUMS.txt
